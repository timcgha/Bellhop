<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bellhop v6</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:-apple-system,"SF Pro Rounded",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#ctl{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;left:12px;top:10px;display:flex;gap:8px;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(20,60,80,.45);font-size:17px}
.pill{background:rgba(20,60,80,.42);border-radius:999px;padding:6px 12px}
#mute{position:fixed;right:12px;top:10px;background:rgba(20,60,80,.42);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:800;touch-action:none}
#toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);background:#fff8e6;color:#1e7f85;border:3px solid #f5b400;border-radius:16px;padding:8px 18px;font-weight:800;font-size:18px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 0 rgba(20,60,80,.5);opacity:.95;transition:opacity 1.5s;pointer-events:none;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:4;transition:opacity .6s;padding:0 14px}
#win .big{font-size:min(12.5vw,72px);font-weight:900;color:#fff3c4;-webkit-text-stroke:3px #1e7f85;text-shadow:0 8px 0 rgba(30,127,133,.35);letter-spacing:2px;text-align:center;line-height:1.05;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#win .sm{margin-top:12px;font-size:min(5vw,23px);font-weight:800;color:#fff;text-align:center;text-shadow:0 3px 0 rgba(20,60,80,.55);animation:pop .7s .18s backwards cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(159,220,255,.55);z-index:5;pointer-events:none}
#start .card{background:#fff8e6;border:4px solid #1e7f85;border-radius:26px;padding:22px 26px;max-width:min(520px,94vw);text-align:center;box-shadow:0 14px 40px rgba(10,60,90,.28);pointer-events:auto}
#start h1{margin:0;font-size:38px;letter-spacing:2px;color:#1e7f85;font-weight:900}
#start .sub{margin:2px 0 10px;color:#1c2b33;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#start p{margin:6px 0;line-height:1.35;color:#1c2b33;font-size:15px}
#start .keys{font-size:13px;color:#3d5560;background:#e9f6f7;border-radius:12px;padding:8px 10px}
#start .level-pick{display:flex;gap:12px;justify-content:center;margin:14px 0 8px;flex-wrap:wrap}
#start .lvl-card{flex:1 1 140px;max-width:180px;padding:8px;border-radius:18px;border:4px solid #b8d4d8;background:#e9f6f7;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s}
#start .lvl-card.sel{border-color:#f5b400;background:#fff3c4;box-shadow:0 0 0 3px rgba(245,180,0,.35),0 6px 16px rgba(10,60,90,.2);transform:scale(1.04)}
#start .lvl-card.sel.pulse{animation:lvlPulse .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes lvlPulse{0%{transform:scale(1.04)}40%{transform:scale(1.12)}100%{transform:scale(1.04)}}
#start .lvl-card:active{transform:scale(0.98)}
#start .lvl-card.sel:active{transform:scale(1.0)}
#start .lvl-art{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
#start .lvl-label{display:block;margin-top:6px;font-size:12px;font-weight:800;color:#1e7f85;letter-spacing:.3px}
#start .pick-hint{font-size:14px;font-weight:800;color:#1e7f85;margin:4px 0 10px}
#start small{display:block;margin-top:10px;font-size:11px;color:#3d5560}
.tbtn{position:fixed;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.75);color:#fff;font-weight:900;font-size:22px;display:none;align-items:center;justify-content:center;flex-direction:column;line-height:1;touch-action:none;text-shadow:0 1px 0 rgba(0,0,0,.3);z-index:6}
.tbtn small{font-size:9px;font-weight:700;opacity:.95;margin-top:2px}
body.touch .tbtn{display:flex}
#bA{right:22px;bottom:30px;background:rgba(70,190,120,.5)}
#bB{right:104px;bottom:64px;background:rgba(235,85,85,.5)}
#bY{right:44px;bottom:114px;background:rgba(245,180,0,.55)}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.65)}
</style>
</head>

  if(near&&d<11&&e.stunT<=0&&d>2.2){e.spitT-=dt;if(e.spitT<=0&&e.wind<=0)e.wind=0.5;}
  if(e.wind>0){e.wind-=dt;if(e.wind<=0){spit(e);e.spitT=rand(2.2,3.4)*e.spitMul;}}

  if(e.hurtT>0){sx*=1.25;sy*=0.6;}
  if(e.stunT>0){sy*=0.85;g.rotation.z=Math.sin(time*20)*0.15;}else g.rotation.z=0;
  g.scale.set(sx*e.size,sy*e.size,sx*e.size);g.position.set(e.x,e.y+hop*e.size,e.z);
  u.body.material.color.setHex(e.hurtT>0?0xffffff:(e.stunT>0?e.stunCol:e.col));
  const CR=0.45+e.size*0.45;if(!P.dead&&d<CR&&Math.abs(dy)<1.4*e.size){const feet=P.pos.y-(e.y+hop);const nx=dx/(d||1),nz=dz/(d||1);
    if(feet>0.3*e.size&&P.vel.y<-1){hitGloop(e,1,-nx*3,-nz*3);P.vel.y=8.5;P.puff=true;P.puffAir=0;endHover();P.sq=1.3;P.grounded=false;spawnRing(P.pos.x,P.pos.y,P.pos.z,e.stunCol,0.3,4,0.3);}
    else if(feet<=0.3*e.size){const push=(CR-d)*0.5;P.pos.x+=nx*push;P.pos.z+=nz*push;e.x-=nx*push;e.z-=nz*push;}}

function updateSharks(dt){
  for(const s of sharks){
    if(!s.alive)continue;
    if(s.state==='trapped'){
      s.trapT+=dt;s.y+=dt*1.6;s.g.position.y=s.y;
      if(s.bubble)s.bubble.scale.setScalar(0.9+Math.sin(s.trapT*8)*0.05);
      if(s.trapT>1.1){
        SFX.bubblePop();spawnRing(s.x,s.y+0.4,s.z,0xd8f8ff,0.35,5,0.35);
        if(s.note)revealHeldNote(s.note);
        s.alive=false;s.g.visible=false;
      }
      continue;
    }
    s.y=s.yBase+Math.sin(time*1.1+s.ph)*0.28;
    const dx=P.pos.x-s.x,dz=P.pos.z-s.z,d=Math.hypot(dx,dz)||0.01;
    const hx=s.hx-s.x,hz=s.hz-s.z,dHome=Math.hypot(hx,hz)||0.001;
    if(s.backT>0)s.backT-=dt;
    let mx=0,mz=0,sp=0;
    if(s.backT>0){
      // just bit: retreat toward home instead of chain-biting
      if(dHome>1){mx=hx/dHome;mz=hz/dHome;sp=2.4;s.face=Math.atan2(mx,mz);}
      else s.face=Math.atan2(-dx,-dz);
    }else if(!P.dead&&d<SHARK_AGGRO&&dHome<SHARK_LEASH){
      s.face=Math.atan2(dx,dz);
      if(d>0.8){mx=dx/d;mz=dz/d;sp=2.4;}
    }else if(dHome>0.6){
      mx=hx/dHome;mz=hz/dHome;sp=2.0;s.face=Math.atan2(mx,mz);
    }else{
      s.face=s.ph+Math.sin(time*0.35+s.ph)*0.9;
    }
    if(sp>0){s.x+=mx*sp*dt;s.z+=mz*sp*dt;}
    s.g.rotation.y=angDamp(s.g.rotation.y,s.face,4,dt);
    s.g.position.set(s.x,s.y,s.z);
    if(s.hurtT>0)s.hurtT-=dt;
    if(!P.dead&&P.inv<=0&&s.backT<=0&&d<0.85&&Math.abs(P.pos.y-s.y)<1.1){
      hurtPlayer(dx/d*4,dz/d*4,0x6a7a8a);SFX.sharkBite();s.backT=2.2;
    }
  }
}
function updateFish(dt){
  const px=P.pos.x,pz=P.pos.z;
  for(const f of fish){
    if(!f.alive)continue;
    const dx=f.x-px,dz=f.z-pz,d=Math.hypot(dx,dz);
    if(d<3.5&&d>0.05){
      const flee=(1-d/3.5)*3.5;
      f.vx+=dx/d*flee*dt*8;f.vz+=dz/d*flee*dt*8;
      if(d<0.55&&f.kind==='ordinary'){
        P.vel.x-=dx/d*0.8*dt;P.vel.z-=dz/d*0.8*dt;
      }
    }
    // gentle pull back toward home so scared fish do not drift away forever
    f.vx+=(f.hx-f.x)*0.8*dt;f.vz+=(f.hz-f.z)*0.8*dt;
    f.vx=damp(f.vx,0,2.5,dt);f.vz=damp(f.vz,0,2.5,dt);
    f.x+=f.vx*dt;f.z+=f.vz*dt;
    f.y=f.hy+Math.sin(time*1.8+f.ph)*0.12;
    f.g.position.set(f.x,f.y,f.z);
    f.g.rotation.y=Math.atan2(f.vx,f.vz)||f.g.rotation.y;
    if(f.kind==='note'){f.g.rotation.y+=dt*0.6;f.g.scale.setScalar(1+Math.sin(time*4+f.ph)*0.08);}
  }
}
function updateSpikefish(dt){
  for(const sp of spikefish){
    if(!sp.alive)continue;
    sp.pathT+=dt*0.12*sp.pathDir;
    if(sp.pathT>=1){sp.pathT=1;sp.pathDir=-1;}else if(sp.pathT<=0){sp.pathT=0;sp.pathDir=1;}
    const k=sp.pathT;
    sp.x=lerp(sp.x1,sp.x2,k);sp.y=lerp(sp.y1,sp.y2,k)+Math.sin(time*0.9+sp.ph)*0.15;sp.z=lerp(sp.z1,sp.z2,k);
    sp.g.position.set(sp.x,sp.y,sp.z);
    sp.g.rotation.y=Math.atan2(sp.x2-sp.x1,sp.z2-sp.z1);
    const d=Math.hypot(sp.x-P.pos.x,sp.z-P.pos.z);
    if(d<7&&Math.abs(sp.y-P.pos.y)<2.5){
      sp.warnT-=dt;
      if(sp.warnT<=0){sp.warnT=1.8;SFX.spikeWarn();}
    }
    if(!P.dead&&P.inv<=0&&d<0.7&&Math.abs(P.pos.y-sp.y)<0.8){
      const dx=sp.x-P.pos.x,dz=sp.z-P.pos.z,l=Math.hypot(dx,dz)||1;
      hurtPlayer(dx/l*3,dz/l*3,0x9a7ab8);SFX.spikeTouch();
    }
  }
}
function updateBubbleShots(dt){
  for(const b of bubbleShots){
    if(!b.alive)continue;
    b.life-=dt;b.pos.x+=b.vel.x*dt;b.pos.y+=b.vel.y*dt;b.pos.z+=b.vel.z*dt;
    b.vel.y+=GRAV*0.15*dt;
    b.m.position.copy(b.pos);
    b.m.scale.setScalar(0.22+Math.sin(time*12)*0.03);
    if(bubbleHitSomething(b,b.pos.x,b.pos.y,b.pos.z)||b.life<=0){
      b.alive=false;b.m.visible=false;
    }
  }
}
function updateClams(dt){
  for(const c of clams){
    c.cd=Math.max(0,c.cd-dt);

    const top=c.g.userData.top;

function wreckDeck(x,y,z,w,d,holeW,holeD,holeOz){
  if(!WRECK)initWreck(x,z);
  const col=0x7a5a3a;

  const seg=(sx,sz,sw,sd,weeds)=>{addSolid(sx,y,sz,sw,0.5,sd,col,{surf:'stone'});dressWreckSurface(sx,y,sz,sw,0.5,sd,weeds);};
  if(!holeW||holeW<=0){seg(x,z,w,d,true);return;}
  const hw=holeW/2,hd=holeD/2,nw=(w-holeW)/2,hz=z+(holeOz||0);
  if(nw>0.2){seg(x-nw/2-hw/2,z,w/2-hw/2,d,true);seg(x+nw/2+hw/2,z,w/2-hw/2,d,true);}
  const south=hz-hd-(z-d/2),north=(z+d/2)-(hz+hd);
  if(south>0.2)seg(x,z-d/2+south/2,holeW,south,false);
  if(north>0.2)seg(x,z+d/2-north/2,holeW,north,false);

  camera.position.set(CAM.pos.x+rand(-sh,sh),CAM.pos.y+rand(-sh,sh),CAM.pos.z+rand(-sh,sh));camera.lookAt(CAM.look);

  // A touch more FOV in interiors gives breathing room without changing Level 1.
  const baseFov=tight?68:60;
  const fov=baseFov+CAM.fovKick;if(Math.abs(camera.fov-fov)>0.01){camera.fov=fov;camera.updateProjectionMatrix();}
}

// ---------- loop ----------
camera.position.copy(CAM.pos);camera.lookAt(CAM.look);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  pollGamepad(dt);
  if(!started){updateClouds(dt);updateSnoozles(dt);updateZ(dt);updatePlayerVisual(dt);renderer.render(scene,camera);return;}
  time+=dt;
  readKeys(dt);if(T.stickId!==null){IN.mx=T.jx;IN.mz=T.jy;}if(HELD.a)IN.jumpHeld=true;if(HELD.b)IN.bHeld=true;
  updatePlayer(dt);updateWobblers(dt);updatePinwheels(dt);updateToss(dt);updateNotes(dt);updateSnoozles(dt);updateBoat(dt);updateWindmill(dt);updateFans(dt);updateClouds(dt);updateGloops(dt);updateGoos(dt);updatePuddles(dt);updateFires(dt);updateCrates(dt);updatePowers(dt);updateHearts(dt);updateChecks(dt);
  updateSharks(dt);updateFish(dt);updateSpikefish(dt);updateBubbleShots(dt);updateClams(dt);updateKelp(dt);
  updateWin(dt);FINISH.update(dt,won?winT:-1);
  updateParticles(dt);updateRings(dt);updateZ(dt);updateCamera(dt);updatePlayerVisual(dt);
  IN.jump=IN.b=IN.y=false;IN.jumpHeld=IN.bHeld=false;IN.camDX=IN.camDY=0;IN.mx=IN.mz=0;
  renderer.render(scene,camera);}
requestAnimationFrame(frame);
updateHUD();

// ---- BUILD:END ----
})();
</script>
