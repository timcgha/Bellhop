name: BH-001 bounded ownership publisher v2
on:
  push:
    branches: [fix/bh-001-cross-level-cleanup]
    paths: [.github/workflows/bh001-bounded-ownership-publisher-v2.yml]
permissions:
  contents: write
concurrency:
  group: bh001-bounded-ownership-publisher
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify authorized source and exact publication ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c3c095679f04ecbf2a83465f6689c2ee6a94f5c4
          test "$(git rev-parse HEAD^^)" = f9b6b476cb8b41f8cbef73ac020154349104cd31
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1ebfb953448e502b297f2f8d1f3035f40c4c0a9d
          test "$(git rev-parse 1ebfb953448e502b297f2f8d1f3035f40c4c0a9d^{tree})" = 6463364ae41fc017fdd58d55ebbb163c8af93990
          test "$(git ls-remote origin refs/heads/fix/bh-001-cross-level-cleanup | cut -f1)" = "$GITHUB_SHA"
          git status --short
      - name: Materialize and verify the reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,re
          from pathlib import Path
          text=Path('.github/workflows/bh001-bounded-ownership-publisher.yml').read_text()
          match=re.search(r"payload='([^']+)'",text)
          if not match: raise SystemExit('reviewed patch payload missing')
          data=zlib.decompress(base64.b64decode(match.group(1)))
          expected='9f2a5d128cb067c1d42c18818534134ce3accfbebe5f348372fce64cb3c53dbe'
          if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('reviewed patch integrity mismatch')
          Path('/tmp/bh001-bounded-cleanup.py').write_bytes(data)
          print('Reviewed exact-anchor patch integrity: PASS')
          PY
      - name: Prove the original leak and corrected lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/bh001-bounded-cleanup.py instrument
          node --check tools/browser-cross-level-isolation-verify.js
          node build.js
          mkdir -p artifacts/bh001-ownership-proof
          set +e
          node tools/browser-cross-level-isolation-verify.js --probe-conch > artifacts/bh001-ownership-proof/before.log 2>&1
          before=$?
          set -e
          cp artifacts/browser-cross-level-isolation/conch-ownership-probe.json artifacts/bh001-ownership-proof/before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/bh001-ownership-proof/before.json').read_text())
          assert p['status']=='FAIL'
          assert p['probe']['state']['attached']
          assert p['probe']['detectedAsUnowned']
          assert not p['probe']['rainbow']['registered']
          print('Original orphan detected by the strengthened verifier: PASS')
          PY
          test "$before" -eq 1
          python3 /tmp/bh001-bounded-cleanup.py rainbow
          node build.js
          node tools/browser-cross-level-isolation-verify.js --probe-conch > artifacts/bh001-ownership-proof/after.log 2>&1
          cp artifacts/browser-cross-level-isolation/conch-ownership-probe.json artifacts/bh001-ownership-proof/after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/bh001-ownership-proof/after.json').read_text())
          assert p['status']=='PASS'
          assert p['probe']['rainbow']['registered']
          assert not p['probe']['state']['attached']
          assert not p['probe']['detectedAsUnowned']
          assert p['probe']['ownership']['unownedObjects']==0
          print('Conch ownership correction and cleanup: PASS')
          PY
          node --check tools/browser-cross-level-isolation-verify.js
          git diff --check
          git diff -- src/deep.js src/entities.js tools/browser-cross-level-isolation-verify.js > artifacts/bh001-ownership-proof/implementation.patch
      - name: Publish the three bounded source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/deep.js src/entities.js tools/browser-cross-level-isolation-verify.js
          git commit -m 'Own Conch rainbow and verify hidden lifecycle residue'
          expected="$(git rev-parse HEAD^)"
          observed="$(git ls-remote origin refs/heads/fix/bh-001-cross-level-cleanup | cut -f1)"
          printf 'Expected parent: %s\nObserved remote: %s\n' "$expected" "$observed"
          test "$observed" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1ebfb953448e502b297f2f8d1f3035f40c4c0a9d
          git push origin HEAD:fix/bh-001-cross-level-cleanup
          git rev-parse HEAD
      - name: Upload exact red-green ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bh001-ownership-red-green
          path: artifacts/bh001-ownership-proof/
          if-no-files-found: warn
