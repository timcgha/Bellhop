name: level5-enhancement-build

on:
  push:
    branches:
      - level5-desert-playtest-enhancement

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow Desert runtime enhancements
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/desert.js';
          let s=fs.readFileSync(p,'utf8');
          function once(oldText,newText,label){
            if(!s.includes(oldText))throw new Error('missing expected Desert source for '+label);
            s=s.replace(oldText,newText);
          }
          once("t.repeat.set(28,84)","t.repeat.set(28,420)",'sand texture repeat');
          once("scene.background=new THREE.Color(0xffc36f);scene.fog=new THREE.Fog(0xffc36f,46,138);","scene.background=new THREE.Color(0xffc36f);scene.fog=new THREE.Fog(0xffc36f,48,155);",'desert fog');
          once("const floor=new THREE.Mesh(new THREE.PlaneGeometry(44,176),desertMat());floor.rotation.x=-Math.PI/2;floor.position.set(0,-0.025,-45);desertGroup.add(floor);","const floor=new THREE.Mesh(new THREE.PlaneGeometry(44,900),desertMat());floor.rotation.x=-Math.PI/2;floor.position.set(0,-0.025,-400);desertGroup.add(floor);",'desert floor');
          once("for(const q of[[-25,-15,10,1.0,28], [25,-42,11,1.1,38],[-26,-86,13,1.2,42],[26,-108,12,1.15,34]]){","for(const q of[[-25,-15,10,1.0,28],[25,-125,11,1.1,56],[-26,-300,13,1.2,78],[26,-485,12,1.15,78],[-26,-665,12,1.1,76],[26,-790,11,1.0,44]]){",'desert edge dunes');
          once("for(const q of[[-15,-88,3.8],[15,-112,3.3],[-17,-120,2.8],[16,18,2.4]]){","for(const q of[[-15,-88,3.8],[15,-175,3.3],[-17,-270,3.0],[16,-365,3.5],[-16,-470,3.1],[17,-575,3.6],[-15,-690,3.2],[16,-785,3.4],[16,18,2.4]]){",'background mesas');
          once("const neck=new THREE.Group();neck.position.set(0,1.5,-0.34);neck.rotation.x=-0.25;neck.add(mesh(CYL,fur,0,0.5,0,0.22,1.3,0.22));neck.add(mesh(SPH,fur,0,1.15,-0.02,0.36,0.28,0.32));neck.add(mesh(SPH,dark,-0.13,1.2,-0.27,0.05));neck.add(mesh(SPH,dark,0.13,1.2,-0.27,0.05));g.add(neck);","const neck=new THREE.Group();neck.position.set(0,1.5,0.34);neck.rotation.x=0.25;neck.add(mesh(CYL,fur,0,0.5,0,0.22,1.3,0.22));neck.add(mesh(SPH,fur,0,1.15,0.02,0.36,0.28,0.32));neck.add(mesh(SPH,dark,-0.13,1.2,0.27,0.05));neck.add(mesh(SPH,dark,0.13,1.2,0.27,0.05));g.add(neck);",'camel forward axis');
          once("g.add(mesh(SPH,cream,0,1.66,0.43,0.22,0.18,0.12));","g.add(mesh(SPH,cream,0,1.66,-0.43,0.22,0.18,0.12));",'camel tail');
          const a=s.indexOf('function addOasis(ox,oy,oz){');
          const b=s.indexOf('function updateOasisCelebration(dt,winT){',a);
          if(a<0||b<0)throw new Error('oasis function markers not found');
          const oasis=`function addOasis(ox,oy,oz){
  const g=new THREE.Group();g.position.set(ox,oy,oz);g.visible=false;scene.add(g);
  const grass=lam(0x43a447),grassBright=lam(0x79c95c),grassDeep=lam(0x2f8740);
  const water=new THREE.MeshBasicMaterial({color:0x45cbea,transparent:true,opacity:0.9}),waterGlow=new THREE.MeshBasicMaterial({color:0xa7f3ff,transparent:true,opacity:0.26});
  const palm=lam(0x6a4a28),leaf=lam(0x2f9140),leafBright=lam(0x58b94e),reed=lam(0x4aa54a),shrub=lam(0x378f45),shrubBright=lam(0x67bd52);
  g.add(mesh(SPH,grass,0,0.1,0,14.5,0.5,10.5));
  g.add(mesh(SPH,grassBright,-5.2,0.17,-1.0,7.2,0.26,5.0));
  g.add(mesh(SPH,grassBright,5.6,0.16,-1.8,6.8,0.24,4.8));
  g.add(mesh(SPH,grassDeep,0,0.14,-5.1,8.4,0.2,3.2));
  const pool=new THREE.Mesh(new THREE.CylinderGeometry(5.4,5.75,0.09,36),water);pool.position.set(0,0.23,0);g.add(pool);
  const shine=new THREE.Mesh(new THREE.CylinderGeometry(4.75,4.95,0.025,36),waterGlow);shine.position.set(-0.25,0.285,-0.15);g.add(shine);
  const palms=[[-8.3,-2.8],[-7.6,4.0],[8.2,-3.0],[7.7,4.2],[-4.4,-6.5],[4.5,-6.4],[-9.1,0.8],[9.0,0.7],[0,-7.4]];
  for(let i=0;i<palms.length;i++){const q=palms[i],px=q[0],pz=q[1],h=3.9+(i%3)*0.52;g.add(mesh(CYL,palm,px,h*0.5,pz,0.16,h,0.16));for(let j=0;j<6;j++){const fr=mesh(CONE,j%2?leafBright:leaf,px,h,pz,0.5,1.95,0.18);fr.rotation.z=j/6*TAU;fr.rotation.y=j/6*TAU;g.add(fr);}}
  const shrubs=[[-10,-3],[-9,3],[-6,6],[-3,-7],[3,-7],[6,6],[9,3],[10,-3],[-7,-5],[7,-5],[-11,0],[11,0],[-4,5],[4,5],[-7,1],[7,1],[-2,-6],[2,-6]];
  for(let i=0;i<shrubs.length;i++){const q=shrubs[i],m=i%2?shrubBright:shrub;g.add(mesh(SPH,m,q[0],0.5+(i%3)*0.08,q[1],0.75+(i%2)*0.2,0.45+(i%3)*0.08,0.7));}
  for(let i=0;i<24;i++){const a=i/24*TAU,r=5.85+(i%2)*0.18,px=Math.cos(a)*r,pz=Math.sin(a)*r*0.82;g.add(mesh(CYL,reed,px,0.52,pz,0.035,0.86+(i%3)*0.12,0.035));}
  const flowerM=[lam(0xffcf5a),lam(0xff8b83),lam(0xf694d7),lam(0xffffff)];
  for(let i=0;i<32;i++){const a=(i*2.399),r=6.2+(i%7)*0.72,px=Math.cos(a)*r,pz=Math.sin(a)*r*0.68;if(pz>3.5&&Math.abs(px)<3.2)continue;g.add(mesh(SPH,flowerM[i%flowerM.length],px,0.4,pz,0.14,0.12,0.14));}
  const stoneM=[lam(0xd8c49a),lam(0xbfa77d)];for(let i=0;i<18;i++){const a=i/18*TAU,r=5.55,px=Math.cos(a)*r,pz=Math.sin(a)*r*0.82;g.add(mesh(SPH,stoneM[i%2],px,0.3,pz,0.27,0.14,0.22));}
  const portal=new THREE.Group();portal.position.set(0,0.4,8);const halo=new THREE.Mesh(new THREE.TorusGeometry(2.25,0.24,10,36),new THREE.MeshBasicMaterial({color:0xffd264,transparent:true,opacity:0.82}));halo.rotation.x=Math.PI/2;portal.add(halo);portal.add(mesh(SPH,new THREE.MeshBasicMaterial({color:0xffc05a,transparent:true,opacity:0.34}),0,0.28,0,1.9,0.22,1.9));portal.visible=false;desertGroup.add(portal);
  if(DESERT){DESERT.oasis={x:ox,y:oy,z:oz,g,pool,waterShine:shine,portalHalo:halo};DESERT.oasisGroup=g;DESERT.portal=portal;}
  registerFinish({x:ox,z:oz,top:oy+5.2,winMsg:'You found the green oasis!',onAllAwake(){},onWin(){if(DESERT&&DESERT.oasisGroup)DESERT.oasisGroup.visible=true;},update(dt,winT){updateOasisCelebration(dt,winT);},camHold(dt){oasisCameraHold(dt);}});
  return g;
}
`;
          s=s.slice(0,a)+oasis+s.slice(b);
          const shimmer="  if(o.pool&&o.pool.material)o.pool.material.opacity=0.72+Math.sin(time*2)*0.12;";
          if(!s.includes(shimmer))throw new Error('oasis shimmer line missing');
          s=s.replace(shimmer,shimmer+"\n  if(o.waterShine&&o.waterShine.material)o.waterShine.material.opacity=0.18+Math.sin(time*1.7)*0.08;");
          fs.writeFileSync(p,s);

          const tp='tests/level5-desert.test.js';
          let t=fs.readFileSync(tp,'utf8');
          const old="const ramp=H.W.solids.filter(s=>s.role==='desertRamp').sort((a,b)=>b.min.z-a.min.z);";
          const neu="const ramp=H.W.solids.filter(s=>s.role==='desertRamp'&&s.min.z<-700).sort((a,b)=>b.min.z-a.min.z);";
          if(!t.includes(old))throw new Error('baseline final-ramp selector not found');
          t=t.replace(old,neu);
          fs.writeFileSync(tp,t);
          NODE
      - name: Rebuild bundled game
        run: node build.js
      - name: Verify bundle
        run: node build.js --check
      - name: Deterministic regression suite
        run: node tests/run.js
      - name: Commit generated bundle and runtime patch
        run: |
          git config user.name "Bellhop CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/level5-enhancement-build.yml
          git add src/desert.js tests/level5-desert.test.js index.html
          git commit -m "Fix camel direction and enrich Level 5 desert runtime"
          git push origin HEAD:level5-desert-playtest-enhancement
