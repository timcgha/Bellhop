name: level5-enhancement-build

on:
  push:
    branches: [level5-desert-playtest-enhancement]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/tmp-level5-enhancement-patch.js
      - run: node tools/tmp-level5-gap-fix.js
      - run: node build.js
      - run: node build.js --check
      - run: node tests/run.js
      - name: Commit runtime patch and rebuilt bundle
        run: |
          git config user.name "Bellhop CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/level5-enhancement-build.yml tools/tmp-level5-enhancement-patch.js tools/tmp-level5-gap-fix.js
          git add levels/level5.js src/desert.js tests/level5-desert.test.js index.html
          git commit -m "Fix camel direction and enrich Level 5 desert runtime"
          git push origin HEAD:level5-desert-playtest-enhancement
