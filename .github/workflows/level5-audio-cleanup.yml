name: Level 5 Audio Cleanup

on:
  push:
    branches:
      - feature/level5-desert-mvp

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pre-Level-5 Space timing only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/audio.js')
          s=p.read_text()
          old="else tone(hz(chord[0]+[0,3,7,10][s%4]+12,261.63),0.45,{at:t,type:'sine',gain:0.035,attack:0.02});\n}\nfunction desertBed"
          new="else tone(hz(chord[0]+[0,3,7,10][s%4]+12,261.63),0.45,{at:t,type:'sine',gain:0.035,attack:0.03});\n}\nfunction desertBed"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one Space timing target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Rebuild generated index
        run: node build.js
      - name: Validate
        run: |
          node build.js --check
          node tests/run.js
      - name: Publish exact cleanup
        shell: bash
        run: |
          unexpected="$(git status --porcelain | grep -vE '^ M (src/audio\.js|index\.html)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audio.js index.html
          git commit -m 'chore(level5): preserve existing Space audio timing'
          git push origin HEAD:feature/level5-desert-mvp
