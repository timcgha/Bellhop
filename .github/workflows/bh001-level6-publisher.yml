name: BH-001 bounded Level 6 verifier publisher
on:
  push:
    branches: [fix/bh-001-cross-level-cleanup]
    paths: [.github/workflows/bh001-level6-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Publish verified verifier-only correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cada9d90f7cbcf1e48e811b4bc426bd1ecc44ea0"
          test "$(git hash-object tools/browser-level6-winter-verify.js)" = "93756e990b6bbcc9612dfdbb2583918635972ea2"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "1ebfb953448e502b297f2f8d1f3035f40c4c0a9d"
          test "$(git ls-remote origin refs/heads/fix/bh-001-cross-level-cleanup | cut -f1)" = "$(git rev-parse HEAD)"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/timcgha/Bellhop/git/blobs/6a3199fe1845ed456702092a700ae36cf465c2c9 | jq -r .content | base64 -d > tools/browser-level6-winter-verify.js
          test "$(git hash-object tools/browser-level6-winter-verify.js)" = "6a3199fe1845ed456702092a700ae36cf465c2c9"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-level6-winter-verify.js')
          s=p.read_text()
          old='Math.hypot(p.x-t.x,p.z-t.z}'
          assert s.count(old)==1
          p.write_text(s.replace(old,'Math.hypot(p.x-t.x,p.z-t.z)'))
          PY
          node --check tools/browser-level6-winter-verify.js
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('tools/browser-level6-winter-verify.js','utf8');
          const m=s.match(/const finaleState=\(\)=>cdp\.evaluate\(`([^`]+)`\);/);
          if(!m)throw Error('Finale diagnostic expression missing');
          new Function('return '+m[1]);
          if(!s.includes("finaleTarget.x,finaleTarget.z,'Christmas tree finale'"))throw Error('Authored target missing');
          JS
          git diff --check
          test "$(git diff --name-only)" = "tools/browser-level6-winter-verify.js"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-level6-winter-verify.js
          git commit -m 'BH-001: Prove Level 6 victory at authored trigger'
          test "$(git ls-remote origin refs/heads/fix/bh-001-cross-level-cleanup | cut -f1)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:refs/heads/fix/bh-001-cross-level-cleanup
