name: BH-001 Apply Cleanup 2

on:
  push:
    branches: [fix/bh-001-cross-level-cleanup]
    paths: [.github/workflows/bh001-apply-cleanup2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bh-001-cross-level-cleanup
          fetch-depth: 0
      - name: Apply observed lifecycle cleanup fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/deep.js')
          s=p.read_text()
          old="function dressPlatform(x,y,z,w,h,d){\n  const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);"
          new="function dressPlatform(x,y,z,w,h,d){\n  const g=new THREE.Group();g.position.set(x,y,z);addDecor(g);"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one dressPlatform scene add, found {s.count(old)}')
          p.write_text(s.replace(old,new))

          p=Path('src/fx.js')
          s=p.read_text()
          anchor="function updateZ(dt){for(const o of ZS){if(o.life<=0)continue;o.life-=dt;if(o.life<=0){o.s.visible=false;continue;}o.s.position.y+=0.7*dt;o.s.position.x+=o.vx*dt;const k=1-o.life/1.6;o.s.scale.setScalar(0.4+k*0.5);o.s.material.opacity=1-k;}}\n"
          insert=anchor+"function clearTransientFx(){\n  pIdx=0;rIdx=0;zIdx=0;\n  for(const p of PART){p.life=0;p.m.visible=false;}\n  for(const r of RINGS){r.life=0;r.m.visible=false;}\n  for(const o of ZS){o.life=0;o.s.visible=false;}\n}\n"
          if s.count(anchor)!=1:
              raise SystemExit(f'expected exactly one updateZ anchor, found {s.count(anchor)}')
          p.write_text(s.replace(anchor,insert))

          p=Path('src/entities.js')
          s=p.read_text()
          old="function clearLevelWorld(){\n  clearShadowStick();"
          new="function clearLevelWorld(){\n  clearShadowStick();\n  clearTransientFx();"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one clearLevelWorld anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- src/deep.js src/fx.js src/entities.js
      - name: Publish bounded cleanup correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/deep.js src/fx.js src/entities.js
          git commit -m "Clear observed cross-level visual residue"
          git push origin HEAD:fix/bh-001-cross-level-cleanup
