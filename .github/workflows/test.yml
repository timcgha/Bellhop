name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build generated game
        run: node build.js
      - name: Validate generated game
        run: node build.js --check
      - name: Run deterministic suites
        run: node tests/run.js
      - name: Run pause/menu real-browser verification
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-pause-menu-verify.js
      - name: Upload pause/menu browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pause-menu-browser
          path: artifacts/browser-pause-menu/
          if-no-files-found: error
      - name: Run Pling visual real-browser verification
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-player-visual-redesign-verify.js
      - name: Upload Pling visual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pling-visual-browser
          path: artifacts/browser-player-visual-redesign/
          if-no-files-found: error
      - name: Run Level 6 real-browser verification
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-level6-winter-verify.js
      - name: Upload Level 6 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level6-winter-browser
          path: artifacts/browser-level6-winter/
          if-no-files-found: error
      - name: Run cross-level isolation real-browser verification
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-cross-level-isolation-verify.js
      - name: Upload cross-level isolation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-level-isolation-browser
          path: artifacts/browser-cross-level-isolation/
          if-no-files-found: error
      - name: Run Robot Skins real-browser verification
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-robot-skins-verify.js
      - name: Upload Robot Skins browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-skins-browser
          path: artifacts/browser-robot-skins/
          if-no-files-found: error
  movement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compare exact gameplay and synthetic frame schedules
        run: |
          node build.js
          node tools/movement-jump-compare.js
      - name: Capture movement and jump comparison
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-movement-jump-verify.js
      - name: Upload movement comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movement-jump-browser
          path: artifacts/browser-movement-jump/
          if-no-files-found: error
  phone-landscape-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build candidate and exact authorized base
        run: |
          node build.js
          git worktree add --detach "$RUNNER_TEMP/bellhop-bh006-base" 186372621d00b56dd1e3c51db79b33a9a124acdf
          node "$RUNNER_TEMP/bellhop-bh006-base/build.js"
      - name: Confirm focused deterministic regression on base and candidate
        run: |
          mkdir -p artifacts/browser-level-picker-mobile
          set +e
          BELLHOP_HTML="$RUNNER_TEMP/bellhop-bh006-base/dist/index.html" node tests/phone-landscape-menu.test.js > artifacts/browser-level-picker-mobile/baseline-deterministic.log 2>&1
          baseline_status=$?
          set -e
          sed -n '1,160p' artifacts/browser-level-picker-mobile/baseline-deterministic.log
          if [ "$baseline_status" -eq 0 ]; then
            echo "Exact authorized base unexpectedly passed the focused regression"
            exit 1
          fi
          node tests/phone-landscape-menu.test.js 2>&1 | tee artifacts/browser-level-picker-mobile/candidate-deterministic.log
      - name: Capture exact-base expected failure in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
          BELLHOP_EXPECT: fail
          BELLHOP_EVIDENCE_LABEL: baseline
          BELLHOP_EVIDENCE_DIR: artifacts/browser-level-picker-mobile
        run: BELLHOP_DIST="$RUNNER_TEMP/bellhop-bh006-base/dist" node tools/browser-level-picker-mobile-verify.js
      - name: Verify candidate in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
          BELLHOP_EVIDENCE_LABEL: candidate
          BELLHOP_EVIDENCE_DIR: artifacts/browser-level-picker-mobile
        run: node tools/browser-level-picker-mobile-verify.js
      - name: Upload phone landscape menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-landscape-menu-browser
          path: artifacts/browser-level-picker-mobile/
          if-no-files-found: error
  web-hero-web-shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and run focused deterministic web-shot regression
        run: |
          mkdir -p artifacts/browser-web-hero-web-shot
          node build.js
          node build.js --check
          node tests/web-hero-web-shot.test.js 2>&1 | tee artifacts/browser-web-hero-web-shot/web-hero-web-shot-deterministic.log
          cp dist/index.html artifacts/browser-web-hero-web-shot/candidate-index.html
      - name: Verify Web Hero web shot in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/browser-web-hero-web-shot-verify.js
      - name: Upload Web Hero web-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-hero-web-shot-browser
          path: artifacts/browser-web-hero-web-shot/
          if-no-files-found: error
